<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>農曆節日與特殊祭祀｜拜拜要準備什麼金紙｜金山謝鈺豐香店</title>
<meta name="description" content="以農曆為主的祭祀日曆：初一十五、做牙、天公生、清明、中元普渡、冬至、尾牙、除夕，以及結婚、入厝、做七等婚喪喜慶的金紙準備參考。">
<link rel="stylesheet" href="/assets/style.css?v=20261115d">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/"><span class="seal">香</span><span class="t">謝鈺豐香店</span></a>
  <nav><a href="/jieri/" aria-current="page">節日祭祀</a><a href="/hunsang/">婚喪喜慶</a><a href="/mingcheng/">金紙名稱</a></nav>
</div></header>

<main class="wrap">
  <div class="page-head">
    <h1>農曆節日與特殊祭祀</h1>
    <p>點日曆上的日子，看當天要拜誰、準備哪些金紙。點金紙名稱可以看說明。</p>
    <div class="heart">
      <h2>祭祀與思念</h2>
      <p>拜拜，是對神明的敬意，也是對親人的想念。金紙的份量不必越多越好，依禮數準備、帶著誠意，比數量更重要。不確定怎麼準備的時候，歡迎來店裡問問，我們陪你把心意準備好。</p>
    </div>
  </div>

  <section id="now">
    <div class="now-grid">
      <div class="card today-card" id="todayCard"></div>
      <div class="card count-card" id="countCard"></div>
      <div class="card" id="bigCard"></div>
    </div>
  </section>

  <section id="mine">
    <h2>行業專屬祭祀</h2>
    <p class="muted" id="mineLegend" style="margin:-4px 0 12px"></p>
    <div class="grid" id="mineBox"></div>
  </section>

  <section id="calendar">
    <h2>農曆祭祀日曆</h2>
    <div class="card">
      <div class="cal-bar">
        <h3 id="calTitle"></h3>
        <span class="cal-nav"><button class="btn" id="prev" aria-label="上個月">‹</button><button class="btn" id="todayBtn">今天</button><button class="btn" id="next" aria-label="下個月">›</button></span>
      </div>
      <div class="cal" id="cal" role="grid"></div>
      <div class="legend"><span><i style="background:#fdf2e6;border:1px solid #e8c9a8"></i>節日</span><span><i style="background:var(--gold);border-radius:50%"></i>初一十五、做牙</span><span>大字為農曆，小字為國曆</span></div>
      <div class="detail" id="detail" aria-live="polite"></div>
    </div>
  </section>


  <section id="occasions">
    <h2>日常與特殊祭祀</h2>
    <div id="occ"></div>
  </section>

  <section id="tips">
    <h2>小提醒</h2>
    <div class="card" id="tipBox"></div>
  </section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<script src="/assets/data.js?v=20261115d"></script>
<script src="/assets/lunar.js?v=20261115d"></script>
<script src="/assets/common.js?v=20261115d"></script>
<script>
(function(){
  const B = BAIBAI, L = Lunar, NAMES = '/mingcheng/';
  const WD = ['日','一','二','三','四','五','六'];

  const DAY = 86400000;

  function eventsOn(date){
    const l = L.lunarOf(date), out = [];
    for (const e of B.days){
      if (e.rule === 'monthly' && e.d.includes(l.d)) out.push(e);
      else if (e.rule === 'lunar' && !l.leap && l.m === e.m && l.d === e.d) out.push(e);
      else if (e.rule === 'monthEnd' && !l.leap && l.m === e.m){
        const n = L.lunarOf(new Date(date.getTime() + DAY));
        if (n.m !== e.m || n.leap) out.push(e);
      }
      else if (e.rule === 'term' && L.termDate(date.getUTCFullYear(), e.term).getTime() === date.getTime()) out.push(e);
    }
    return { l, ev: out };
  }

  const now = new Date();
  const today = L.utc(now.getFullYear(), now.getMonth() + 1, now.getDate());
  let viewY = today.getUTCFullYear(), viewM = today.getUTCMonth() + 1, sel = today;

  function solarText(d){ return d.getUTCFullYear() + '/' + (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '（' + WD[d.getUTCDay()] + '）'; }

  function evCard(e){
    let h = '<div class="occ-head">' + ICONS[e.type] + '<h4>' + e.name + (e.common ? ' <span class="star" title="一般常見做法">＊</span>' : '') + (e.only ? ' ' + roleBadge(e.roles) : '') + '</h4></div>';
    h += '<dl class="kv"><dt>拜誰</dt><dd>' + e.who + '</dd><dt>金紙</dt><dd>' + linkPapers(e.paper, NAMES) + '</dd>';
    if (e.offer) h += '<dt>供品</dt><dd>' + e.offer + '</dd>';
    if (e.extra) h += '<dt>備註</dt><dd>' + linkPapers(e.extra, NAMES) + '</dd>';
    return h + '</dl>' + (e.shop ? '<div class="shopnote"><span class="seal">香</span><span>' + e.shop + '</span></div>' : '') + (e.fire ? '<div class="fire">' + ICONS.firecracker + '<span>' + B.fire[e.fire] + '</span></div>' : '');
  }

  function render(){
    const first = L.utc(viewY, viewM, 1);
    const days = new Date(Date.UTC(viewY, viewM, 0)).getUTCDate();
    const lFirst = L.lunarOf(first), lLast = L.lunarOf(L.utc(viewY, viewM, days));
    const lm = l => (l.leap ? '閏' : '') + L.monthName(l.m);
    document.getElementById('calTitle').innerHTML = '農曆' + lm(lFirst) + (lm(lFirst) !== lm(lLast) ? '～' + lm(lLast) : '') +
      '<span class="sub">國曆 ' + viewY + ' 年 ' + viewM + ' 月</span>';
    let h = WD.map(w => '<div class="wd">' + w + '</div>').join('');
    for (let i = 0; i < first.getUTCDay(); i++) h += '<div class="day out"></div>';
    for (let d = 1; d <= days; d++){
      const dt = L.utc(viewY, viewM, d), { l, ev } = eventsOn(dt);
      const fest = ev.find(e => e.type !== 'daily'), daily = ev.some(e => e.type === 'daily');
      const cls = ['day'];
      if (fest) cls.push('has'); else if (daily) cls.push('daily');
      if (dt.getTime() === today.getTime()) cls.push('today');
      if (dt.getTime() === sel.getTime()) cls.push('sel');
      const top = l.d === 1 ? (l.leap ? '閏' : '') + L.monthName(l.m) : L.dayName(l.d);
      h += '<button class="' + cls.join(' ') + '" data-t="' + dt.getTime() + '" aria-label="' + solarText(dt) + ' 農曆' + L.label(l) + (ev.length ? '，' + ev.map(e => e.name).join('、') : '') + '">' +
        '<span class="ln' + (l.d === 1 ? ' m1' : '') + '">' + top + '</span><span class="sn">' + d + '</span>' +
        (fest ? '<span class="ev">' + (fest.only ? roleBadge(fest.roles.slice(0, 1)) : '') + fest.name.split('・')[0] + '</span>' : daily ? '<span class="dot"></span>' : '') + '</button>';
    }
    const cal = document.getElementById('cal');
    cal.innerHTML = h;
    cal.querySelectorAll('.day[data-t]').forEach(b => b.onclick = () => { sel = new Date(+b.dataset.t); render(); });
    showDetail();
  }

  function showDetail(){
    const { l, ev } = eventsOn(sel);
    let h = '<p class="muted" style="margin:0 0 6px">農曆' + L.label(l) + '・國曆 ' + solarText(sel) + '</p>';
    h += ev.length ? ev.map(evCard).join('<hr style="border:0;border-top:1px dashed var(--line);margin:12px 0">') : '<p style="margin:0">這天沒有特別的祭祀日。</p>';
    document.getElementById('detail').innerHTML = h;
  }

  const STEM='甲乙丙丁戊己庚辛壬癸', BR='子丑寅卯辰巳午未申酉戌亥', ZO='鼠牛虎兔龍蛇馬羊猴雞狗豬';
  function ganzhi(y){ const i = ((y - 4) % 60 + 60) % 60; return STEM[i % 10] + BR[i % 12] + '年（' + ZO[i % 12] + '）'; }
  function moon(d){
    const p = (d - 1) / 29.53, r = 22, c = 28, k = Math.abs(Math.cos(2 * Math.PI * p)) * r;
    const names = d === 1 ? '新月' : d <= 6 ? '蛾眉月' : d <= 8 ? '上弦月' : d <= 14 ? '盈凸月' : d <= 16 ? '滿月' : d <= 21 ? '虧凸月' : d <= 23 ? '下弦月' : '殘月';
    let path = '';
    if (d > 1 && d < 30){
      const wax = p < .5, s1 = wax ? 1 : 0, s2 = wax ? (p < .25 ? 0 : 1) : (p > .75 ? 1 : 0);
      path = '<path d="M' + c + ' ' + (c - r) + ' A' + r + ' ' + r + ' 0 0 ' + s1 + ' ' + c + ' ' + (c + r) + ' A' + k.toFixed(1) + ' ' + r + ' 0 0 ' + s2 + ' ' + c + ' ' + (c - r) + 'Z" fill="#c9a24a"/>';
    }
    return { svg: '<svg width="56" height="56" viewBox="0 0 56 56" role="img" aria-label="' + names + '"><circle cx="28" cy="28" r="22" fill="#ebe4d4" stroke="#b9ae97"/>' + path + '</svg>', name: names };
  }
  function findNext(test, from, max){
    for (let i = 0; i < max; i++){
      const dt = new Date(from.getTime() + i * DAY), r = eventsOn(dt), e = r.ev.find(test);
      if (e) return { dt, l: r.l, e, days: i };
    }
  }
  function papersIn(text){
    const names = B.papers.slice().sort((x, y) => y.name.length - x.name.length), out = [];
    for (let i = 0; i < text.length;){
      const p = names.find(q => text.startsWith(q.name, i));
      if (p){ if (!out.includes(p)) out.push(p); i += p.name.length; } else i++;
    }
    return out;
  }
  function md(d){ return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '（' + WD[d.getUTCDay()] + '）'; }

  function todayCard(){
    const l = L.lunarOf(today), m = moon(l.d);
    const nx = findNext(e => e.rule === 'monthly' && e.d[0] === 1, new Date(today.getTime() + DAY), 40);
    document.getElementById('todayCard').innerHTML = m.svg +
      '<div class="tc-main"><div class="muted">今天・' + ganzhi(l.y) + '</div><div class="tc-big">' + L.label(l) + '</div><div class="muted">國曆 ' + md(today) + '・' + m.name + '</div></div>' +
      (nx ? '<div class="tc-next"><span class="muted">下次初一十五</span><b>' + L.dayName(nx.l.d) + '・' + (nx.days + 1) + ' 天後</b></div>' : '');
  }

  const leadOf = e => e.big || 0;
  function mine(){
    document.getElementById('mineLegend').innerHTML = '標示 ' + ['fisher','farmer','shop','factory'].map(r => roleBadge([r]) + B.roles[r]).join('　') + ' 的專屬日子';
    const dated = B.days.filter(e => e.only).map(e => findNext(x => x === e, today, 400)).filter(Boolean).sort((a, b) => a.days - b.days);
    const occ = [].concat(...B.occasions.filter(g => g.type === 'work').map(g => g.items));
    document.getElementById('mineBox').innerHTML =
      dated.map(x => '<div class="card"><p class="muted" style="margin:0 0 4px">' + L.label(x.l) + '・' + md(x.dt) + '・' + (x.days === 0 ? '今天' : x.days + ' 天後') + '</p>' + evCard(x.e) + '</div>').join('') +
      occ.map(it => '<div class="card"><div class="occ-head">' + ICONS.work + '<h4>' + it.name + ' ' + roleBadge(it.roles) + '</h4></div><dl class="kv"><dt>金紙</dt><dd>' + linkPapers(it.paper, NAMES) + '</dd>' +
        (it.extra ? '<dt>備註</dt><dd>' + linkPapers(it.extra, NAMES) + '</dd>' : '') + '</dl>' + (it.fire ? '<div class="fire">' + ICONS.firecracker + '<span>' + B.fire[it.fire] + '</span></div>' : '') + '</div>').join('');
  }

  let NEXT;
  function countCard(){
    const n = NEXT = findNext(e => leadOf(e) > 0, today, 400);
    if (!n) return;
    const lead = leadOf(n.e), pct = Math.max(4, Math.min(100, Math.round((1 - n.days / lead) * 100)));
    const ps = papersIn(n.e.paper);
    document.getElementById('countCard').innerHTML =
      '<div class="cc-top"><span class="muted">下一個大型節慶</span><span class="muted">' + L.label(n.l) + '・' + md(n.dt) + '</span></div>' +
      '<div class="cc-title"><span class="cc-name">' + n.e.name.split('・')[0] + '</span><span class="cc-days">' + (n.days === 0 ? '就是今天' : '還有 <b>' + n.days + '</b> 天') + '</span></div>' +
      (n.days <= lead ? '<div class="bar"><i style="width:' + pct + '%"></i></div>' : '') +
      '<div class="muted" style="margin-top:8px">建議提前準備</div><div class="prep">' +
      ps.map(p => '<a class="chip" href="' + NAMES + '#' + p.id + '">' + p.name + '</a>').join('') +
      (n.e.offer ? n.e.offer.split('、').map(o => '<span class="chip offer">' + o + '</span>').join('') : '') + '</div>' +
      '<div class="cc-btns"><button class="btn" id="icsBtn">加入行事曆</button><button class="btn" id="shareBtn">傳給家人</button></div><p class="muted" id="shareMsg" style="margin:6px 0 0" aria-live="polite"></p>';
    document.getElementById('icsBtn').onclick = addCal;
    document.getElementById('shareBtn').onclick = share;
  }
  function planText(n){
    return n.e.name.split('・')[0] + '（' + md(n.dt) + '，農曆' + L.label(n.l) + '）\n金紙：' + n.e.paper + (n.e.offer ? '\n供品：' + n.e.offer : '') + '\n—— 金山謝鈺豐香店・拜拜參考 https://baibai-tw.github.io/jieri/';
  }
  function addCal(){
    const n = NEXT, ymd = d => d.toISOString().slice(0, 10).replace(/-/g, '');
    const esc = t => t.replace(/[,;\\]/g, m => '\\' + m).replace(/\n/g, '\\n');
    const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//baibai-tw//TW','BEGIN:VEVENT',
      'UID:' + ymd(n.dt) + '-' + n.e.name.length + '@baibai-tw.github.io','DTSTAMP:' + ymd(today) + 'T000000Z',
      'DTSTART;VALUE=DATE:' + ymd(n.dt),'DTEND;VALUE=DATE:' + ymd(new Date(n.dt.getTime() + DAY)),
      'SUMMARY:' + esc('拜拜・' + n.e.name.split('・')[0]),'DESCRIPTION:' + esc(planText(n)),
      'BEGIN:VALARM','TRIGGER:-P3D','ACTION:DISPLAY','DESCRIPTION:' + esc('三天後' + n.e.name.split('・')[0] + '，記得準備'),'END:VALARM',
      'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:' + esc('明天' + n.e.name.split('・')[0]),'END:VALARM',
      'END:VEVENT','END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'}));
    a.download = 'baibai-' + ymd(n.dt) + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
    document.getElementById('shareMsg').textContent = '已下載行事曆檔，打開後加入手機行事曆，三天前與前一天會提醒。';
  }
  async function share(){
    const t = planText(NEXT), msg = document.getElementById('shareMsg');
    try {
      if (navigator.share){ await navigator.share({ title: '拜拜準備', text: t }); return; }
      await navigator.clipboard.writeText(t); msg.textContent = '已複製，可以貼到 LINE 傳給家人。';
    } catch (e){ if (e.name !== 'AbortError') msg.textContent = '無法自動分享，請長按複製這頁網址。'; }
  }
  function bigCard(){
    const list = [];
    let from = today;
    while (list.length < 4){
      const n = findNext(e => leadOf(e) > 0, from, 400); if (!n) break;
      n.days = Math.round((n.dt - today) / DAY); list.push(n); from = new Date(n.dt.getTime() + DAY);
    }
    document.getElementById('bigCard').innerHTML = '<div class="muted" style="margin-bottom:8px">接下來的大日子</div><ul class="big-list">' +
      list.map((x, i) => '<li><i class="' + (i === 0 ? 'hot' : '') + '"></i><span><b>' + x.e.name.split('・')[0] + '</b> <span class="muted">' + L.label(x.l) + '・' + md(x.dt) + '</span></span><span class="' + (i === 0 ? 'hot-t' : 'muted') + '">' + (x.days === 0 ? '今天' : x.days + ' 天') + '</span></li>').join('') + '</ul>';
  }

  function occasions(){
    document.getElementById('occ').innerHTML = '<p style="margin:0 0 12px"><a class="btn" href="/hunsang/" style="text-decoration:none;display:inline-block">婚、喪、喜慶的準備 →</a></p>' +
      B.occasions.filter(g => g.type === 'daily').map(g => '<div class="grid">' + g.items.map(it => occCard(it, NAMES)).join('') + '</div>').join('');
  }

  document.getElementById('prev').onclick = () => { if (--viewM < 1){ viewM = 12; viewY--; } render(); };
  document.getElementById('next').onclick = () => { if (++viewM > 12){ viewM = 1; viewY++; } render(); };
  document.getElementById('todayBtn').onclick = () => { viewY = today.getUTCFullYear(); viewM = today.getUTCMonth() + 1; sel = today; render(); };

  document.getElementById('tipBox').innerHTML = '<ul style="margin:0;padding-left:1.2em">' +
    B.tips.map(t => '<li>' + linkPapers(t, NAMES) + '</li>').join('') + '</ul><div class="fire">' + ICONS.firecracker + '<span>' + B.fire.eco + '</span></div>';
  todayCard(); countCard(); bigCard(); mine(); render(); occasions(); renderSources(document.getElementById('foot'));
})();
</script>
</body>
</html>
