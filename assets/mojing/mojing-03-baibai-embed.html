 const ib=document.createElement('button');ib.textContent='寫實／水墨';ib.onclick=()=>{INK_ON=!INK_ON};bar.appendChild(ib);
 const w=document.createElement('button');w.textContent='浪級';w.onclick=()=>{waveTgt=waveCur=(Math.round(waveCur)+1)%4;waveNext=600};bar.appendChild(w);hud.appendChild(bar)}
(async()=>{
 if(!navigator.gpu)return fail();
 const en=document.getElementById('enter'), skip=EMBED||Q.get('noenter')==='1';
 if(!skip)en.classList.remove('hide');
 try{await init()}catch(e){en.classList.add('hide');return fail()}
 if(skip){start();cv.classList.add('on')} else document.getElementById('go').onclick=()=>{start();requestAnimationFrame(()=>{cv.classList.add('on');en.classList.add('out','hide')})};
})();
</script>
