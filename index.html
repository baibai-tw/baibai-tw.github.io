  <script>
  /* 首頁主視覺：多套墨景，進首頁隨機抽一套；店名條上每套一顆印（ch），點印切換。新增一套就在 MJ 加一行 */
  window.KV = (function(){
    const V = '20261121d', D = '/assets/mojing/';
    const MJ = [
      { f: 'mojing-01-baibai-embed.html', q: '&walk=1', ch: '竹', title: '墨竹香塔', p: 'cover-3x4.webp', w: 'cover-16x10.webp' },
      { f: 'mojing-02-baibai-embed.html', q: '', ch: '海', title: '金山夫妻岩', p: 'mojing-02-cover-3x4.webp', w: 'mojing-02-cover-16x10.webp' }
    ];
    const po = document.getElementById('poster'), pw = document.getElementById('poster-w'), pp = document.getElementById('poster-p');
    let i = Math.random() * MJ.length | 0, gpuOk = true;
    function show(n){
      i = (n + MJ.length) % MJ.length; const k = MJ[i];
      pw.srcset = D + k.w + '?v=' + V; pp.src = D + k.p + '?v=' + V; po.hidden = false;
      const mj = document.getElementById('mojing'); if (!mj) return k;
      mj.style.transition = 'none'; mj.classList.remove('on'); void mj.offsetWidth; mj.style.transition = '';   /* 先立刻藏起舊畫面，避免閃白 */
      mj.title = k.title + '動畫';
      if (gpuOk) mj.src = D + k.f + '?embed=1' + k.q + '&v=' + V;
      document.querySelectorAll('.kvseal').forEach(b => { const on = +b.dataset.i === i; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
      return k;
    }
    show(i);
    return { MJ, show, cur(){ return i; }, next(){ return show(i + 1); }, off(){ gpuOk = false; } };
  })();
  </script>

<script>

/* 靜態水墨佔位圖：之後換成動態主視覺（WebGPU），不支援的裝置仍顯示這張 */
(function(){
  const mj = document.getElementById('mojing');
  const ks = document.getElementById('kvseals');
  ks.innerHTML = KV.MJ.map((k, n) => '<button type="button" class="seal kvseal" data-i="' + n + '" aria-label="主視覺：' + k.title + '" title="' + k.title + '">' + k.ch + '</button>').join('');
  ks.querySelectorAll('.kvseal').forEach(b => b.onclick = () => KV.show(+b.dataset.i));
  ks.querySelectorAll('.kvseal').forEach(b => { const on = +b.dataset.i === KV.cur(); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  addEventListener('message', e => {
    if (e.source !== mj.contentWindow || !e.data) return;
    if (e.data.mojing === 'ready') mj.classList.add('on');
    if (e.data.mojing === 'unsupported') { KV.off(); mj.remove(); }   /* 跑不動動畫：留備用圖，點印仍可換圖 */
  });
})();


(function(){
  const B = BAIBAI, L = Lunar, DAY = 86400000, WD = ['日','一','二','三','四','五','六'];
  const now = new Date(), today = L.utc(now.getFullYear(), now.getMonth() + 1, now.getDate());
  const leadOf = e => e.big || 0;
  const eventsOn = window.eventsOnShared;
  const STEM = '甲乙丙丁戊己庚辛壬癸', BR = '子丑寅卯辰巳午未申酉戌亥', ZO = '鼠牛虎兔龍蛇馬羊猴雞狗豬';
  const gz = y => { const i = ((y - 4) % 60 + 60) % 60; return STEM[i % 10] + BR[i % 12] + '年（' + ZO[i % 12] + '）'; };
  function moon(d){
    const p = (d - 1) / 29.53, r = 20, c = 24, k = Math.abs(Math.cos(2 * Math.PI * p)) * r;
    let path = '';
    if (d > 1 && d < 30){ const wax = p < .5, s1 = wax ? 1 : 0, s2 = wax ? (p < .25 ? 0 : 1) : (p > .75 ? 1 : 0);
      path = '<path d="M' + c + ' ' + (c - r) + ' A' + r + ' ' + r + ' 0 0 ' + s1 + ' ' + c + ' ' + (c + r) + ' A' + k.toFixed(1) + ' ' + r + ' 0 0 ' + s2 + ' ' + c + ' ' + (c - r) + 'Z" fill="#c9a24a"/>'; }
    return '<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="#ebe4d4" stroke="#b9ae97"/>' + path + '</svg>';
  }
  const cn = n => { const D = '〇一二三四五六七八九'; return n <= 10 ? (n === 10 ? '十' : D[n]) : n < 20 ? '十' + D[n - 10] : D[Math.floor(n / 10)] + '十' + (n % 10 ? D[n % 10] : ''); };
  const md = d => (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '（' + WD[d.getUTCDay()] + '）';
  const l0 = L.lunarOf(today);
  document.getElementById('today').innerHTML = '<div class="big">' + (l0.leap ? '閏' : '') + L.monthName(l0.m) + L.dayName(l0.d) + '</div><div class="col">' + moon(l0.d).replace('width="48" height="48"', 'width="30" height="30"') + '<div class="sm">' + gz(l0.y).replace(/（.*）/, '') + '</div></div>';
  const ev0 = eventsOn(today).ev;
  document.getElementById('ptoday').innerHTML = moon(l0.d).replace('width="48" height="48"', 'width="40" height="40"') + '<div class="p-date"><div class="big">農曆' + L.label(l0) + '</div><div class="sm">' + gz(l0.y) + '・國曆 ' + today.getUTCFullYear() + ' 年 ' + (today.getUTCMonth() + 1) + ' 月 ' + today.getUTCDate() + ' 日・週' + WD[today.getUTCDay()] + '</div>' + (ev0.length ? '<div class="sm ev">今日：' + ev0.map(e => e.name.split('・')[0]).join('、') + '</div>' : '') + '</div>';
  let w = '';
  for (let i = 0; i < 7; i++){
    const dt = new Date(today.getTime() + i * DAY), { l, ev } = eventsOn(dt);
    const fest = ev.find(e => e.type !== 'daily'), daily = ev.find(e => e.type === 'daily');
    const top = l.d === 1 ? (l.leap ? '閏' : '') + L.monthName(l.m) : L.dayName(l.d);
    w += '<a href="/jieri/" class="' + (i === 0 ? 'today' : fest ? 'has' : '') + '" aria-label="' + md(dt) + ' 農曆' + L.label(l) + (ev.length ? '，' + ev.map(e => e.name).join('、') : '') + '"><span class="w">' + (i === 0 ? '今天' : WD[dt.getUTCDay()]) + '</span><span class="l">' + top + '</span><span class="s">' + (dt.getUTCMonth() + 1) + '/' + dt.getUTCDate() + '</span>' + ((fest || daily) ? '<span class="e">' + ((fest || daily).only ? roleBadge((fest || daily).roles.slice(0, 1), 16) : '') + (fest || daily).name.split(/[・（、]/)[0] + '</span>' : '') + '</a>';
  }
  document.getElementById('week').innerHTML = w;
  for (let i = 0; i < 400; i++){
    const dt = new Date(today.getTime() + i * DAY), { l, ev } = eventsOn(dt), e = ev.find(x => leadOf(x) > 0);
    if (e){ if (festUrl(e)) document.getElementById('next').href = festUrl(e); document.getElementById('next').innerHTML = '<span class="k">下一個大型節慶</span><span class="n">' + e.name.split('・')[0] + '</span><span class="d">' + (i === 0 ? '就是今天' : '還有 <b>' + i + '</b> 天') + '</span><span class="k">農曆' + L.label(l) + '・' + md(dt) + '</span>'; break; }
  }
})();
</script>
